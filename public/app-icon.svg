<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#245476" />
      <stop offset="45%" stop-color="#1e4663" />
      <stop offset="100%" stop-color="#0e2332" />
    </linearGradient>
    <radialGradient id="topGlow" cx="50%" cy="15%" r="65%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.32" />
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#1e4663" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.45" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadowMain" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#051017" flood-opacity="0.55" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3" />
    </filter>
    <filter id="shadowCoin" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#051017" flood-opacity="0.6" />
    </filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#10b981" flood-opacity="0.6" />
    </filter>

    <!-- POS Machine Body Gradients -->
    <linearGradient id="terminalBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="terminalBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="screenGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1b2b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="screenGloss" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="35%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Receipt Gradients -->
    <linearGradient id="receiptGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="90%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Gold Coin Gradients -->
    <linearGradient id="goldCoin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <radialGradient id="goldCore" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="60%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </radialGradient>

    <!-- Accent Emerald -->
    <linearGradient id="emeraldBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Base Icon Background Badge -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="116" fill="url(#topGlow)" />
  <rect width="512" height="512" rx="116" fill="none" stroke="url(#borderGrad)" stroke-width="4" />

  <!-- Transform group for scaling/maskable safe zone -->
  <g transform="translate(0, 0) scale(1)">

    <!-- POS TERMINAL WITH RECEIPT & COIN -->
    <g filter="url(#shadowMain)">

      <!-- RECEIPT SLIDING OUT FROM TOP PRINTER -->
      <g transform="translate(196, 70)">
        <!-- Curved Paper Receipt -->
        <path d="M 10 50 L 10 10 Q 10 0 20 0 L 100 0 Q 110 0 110 10 L 110 50 Z" fill="url(#receiptGrad)" />
        <path d="M 10 50 L 22 43 L 34 50 L 46 43 L 58 50 L 70 43 L 82 50 L 94 43 L 106 50 L 110 47 L 110 0 L 10 0 Z" fill="url(#receiptGrad)" />
        <!-- Receipt Content Lines -->
        <rect x="25" y="16" width="40" height="4" rx="2" fill="#0d9488" />
        <rect x="75" y="16" width="20" height="4" rx="2" fill="#0d9488" />
        <rect x="25" y="24" width="70" height="3" rx="1.5" fill="#94a3b8" />
        <rect x="25" y="31" width="50" height="3" rx="1.5" fill="#94a3b8" />
        <rect x="25" y="38" width="60" height="3" rx="1.5" fill="#94a3b8" />
      </g>

      <!-- TERMINAL BASE / STAND -->
      <path d="M 120 380 L 392 380 L 412 415 Q 416 425 404 425 L 108 425 Q 96 425 100 415 Z" fill="url(#terminalBase)" />
      <!-- Base highlight line -->
      <rect x="130" y="415" width="252" height="3" rx="1.5" fill="#475569" />

      <!-- MAIN POS HOUSING / CHASSIS -->
      <rect x="136" y="105" width="240" height="280" rx="36" fill="url(#terminalBody)" />
      <!-- Front Edge Bevel -->
      <rect x="144" y="113" width="224" height="264" rx="30" fill="#0f172a" />

      <!-- PRINTER DISPENSER BAR -->
      <rect x="190" y="118" width="132" height="10" rx="5" fill="#020617" />
      <rect x="196" y="122" width="120" height="3" rx="1.5" fill="#0d9488" opacity="0.8" />

      <!-- DIGITAL TOUCH DISPLAY -->
      <rect x="156" y="140" width="200" height="175" rx="22" fill="url(#screenGlass)" />
      <rect x="156" y="140" width="200" height="175" rx="22" fill="none" stroke="#1e293b" stroke-width="2" />

      <!-- Screen UI Graphics -->
      <!-- Top header bar on screen -->
      <rect x="170" y="154" width="172" height="18" rx="6" fill="#1e293b" opacity="0.7" />
      <!-- Live Status Dot -->
      <circle cx="182" cy="163" r="4" fill="#10b981" filter="url(#glowGreen)" />
      <rect x="194" y="160" width="60" height="6" rx="3" fill="#38bdf8" opacity="0.9" />
      <rect x="305" y="160" width="26" height="6" rx="3" fill="#94a3b8" opacity="0.6" />

      <!-- Center Sales Metric Chart Bars -->
      <rect x="180" y="210" width="14" height="30" rx="4" fill="#0284c7" opacity="0.75" />
      <rect x="202" y="196" width="14" height="44" rx="4" fill="#0ea5e9" opacity="0.85" />
      <rect x="224" y="184" width="14" height="56" rx="4" fill="#10b981" />
      <rect x="246" y="200" width="14" height="40" rx="4" fill="#38bdf8" opacity="0.75" />

      <!-- Trend line over chart -->
      <path d="M 187 205 L 209 191 L 231 179 L 253 195" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" />

      <!-- Right Side Digital Amount / Barcode Simulation -->
      <rect x="274" y="184" width="68" height="12" rx="4" fill="#0d9488" />
      <rect x="274" y="202" width="48" height="8" rx="3" fill="#64748b" opacity="0.7" />
      <rect x="274" y="214" width="60" height="8" rx="3" fill="#64748b" opacity="0.7" />
      <rect x="274" y="226" width="38" height="8" rx="3" fill="#64748b" opacity="0.7" />

      <!-- Screen Lower Status Ribbon -->
      <rect x="170" y="250" width="172" height="50" rx="14" fill="#031b26" opacity="0.9" />
      <!-- Big Digital Currency Amount Indicator -->
      <text x="256" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Cairo', 'Segoe UI', sans-serif" font-size="19" font-weight="900" fill="#38bdf8" text-anchor="middle" letter-spacing="1">CASHIER POS</text>
      <!-- Subtitle -->
      <text x="256" y="293" font-family="-apple-system, BlinkMacSystemFont, 'Cairo', 'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#10b981" text-anchor="middle">نظام المبيعات الذكي</text>

      <!-- Diagonal Screen Gloss Reflection -->
      <path d="M 158 142 L 310 142 L 200 313 L 158 313 Z" fill="url(#screenGloss)" />

      <!-- LOWER TOUCH / BUTTON CONSOLE -->
      <!-- Smart Card Chip / NFC Reader Wave -->
      <g transform="translate(164, 326)">
        <!-- NFC / Contactless Waves -->
        <rect x="0" y="0" width="80" height="38" rx="10" fill="#1e293b" />
        <path d="M 28 26 A 12 12 0 0 1 28 12" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
        <path d="M 36 29 A 17 17 0 0 1 36 9" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />
        <path d="M 44 32 A 22 22 0 0 1 44 6" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.4" />
      </g>

      <!-- Quick Keypad Grid -->
      <g transform="translate(254, 326)">
        <rect x="0" y="0" width="94" height="38" rx="10" fill="#1e293b" />
        <!-- Keypad Dots -->
        <rect x="10" y="8" width="18" height="9" rx="3" fill="#475569" />
        <rect x="38" y="8" width="18" height="9" rx="3" fill="#475569" />
        <rect x="66" y="8" width="18" height="9" rx="3" fill="#10b981" />

        <rect x="10" y="21" width="18" height="9" rx="3" fill="#475569" />
        <rect x="38" y="21" width="18" height="9" rx="3" fill="#475569" />
        <rect x="66" y="21" width="18" height="9" rx="3" fill="#38bdf8" />
      </g>
    </g>

    <!-- FLOATING GOLDEN COIN (Left-Center overlap for 3D depth) -->
    <g filter="url(#shadowCoin)" transform="translate(85, 275)">
      <!-- Outer Coin Cylinder & Rim -->
      <circle cx="50" cy="50" r="48" fill="url(#goldRim)" />
      <circle cx="50" cy="50" r="44" fill="url(#goldCoin)" />
      <circle cx="50" cy="50" r="38" fill="url(#goldCore)" />
      <circle cx="50" cy="50" r="38" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 3" opacity="0.8" />
      
      <!-- Currency Symbol / Store Emblem in center of coin -->
      <text x="50" y="60" font-family="'Cairo', -apple-system, sans-serif" font-size="32" font-weight="900" fill="#78350f" text-anchor="middle" opacity="0.9">$</text>
      <!-- Subtle 3D shine on coin -->
      <path d="M 20 30 Q 50 14 80 30 Q 50 25 20 30 Z" fill="#ffffff" opacity="0.6" />
    </g>

    <!-- SUCCESS CHECKMARK BADGE (Top Right of Terminal) -->
    <g filter="url(#glowGreen)" transform="translate(340, 100)">
      <circle cx="26" cy="26" r="26" fill="url(#emeraldBadge)" />
      <circle cx="26" cy="26" r="26" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.4" />
      <!-- Crisp Checkmark -->
      <path d="M 16 26 L 23 33 L 36 18" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>

  </g>
</svg>